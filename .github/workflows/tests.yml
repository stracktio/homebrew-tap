name: brew

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A formula bump lands on `main` directly from the cli repo's release workflow,
# so this runs on push too (not just PRs) to catch a broken bump immediately.

permissions:
  contents: read

concurrency:
  group: brew-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, no-install lane: Ruby style + formula audit. Runs on Linux.
  syntax:
    name: style + audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Link this checkout into the Homebrew tap path
        run: |
          tap_dir="$(brew --repository)/Library/Taps/stracktio/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sfn "$GITHUB_WORKSPACE" "$tap_dir"
          brew tap

      - name: brew style
        run: brew style stracktio/tap

      - name: brew audit
        run: brew audit --tap=stracktio/tap

  # Real install lane: downloads the live release phar, verifies its sha256
  # (brew install checks the resource digest), runs the formula's `test do`
  # block, and smoke-tests the wrapper. macOS is the target users install on.
  install:
    name: install + test (macOS)
    runs-on: macos-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Link this checkout into the Homebrew tap path
        run: |
          tap_dir="$(brew --repository)/Library/Taps/stracktio/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sfn "$GITHUB_WORKSPACE" "$tap_dir"
          brew tap

      - name: brew install
        run: brew install --verbose stracktio/tap/strackt

      - name: brew test
        run: brew test --verbose stracktio/tap/strackt

      - name: Smoke-test the installed CLI
        run: strackt --version
